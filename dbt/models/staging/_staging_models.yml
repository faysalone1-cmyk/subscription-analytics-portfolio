version: 2

models:
  - name: stg_customers
    description: >-
      One row per customer with standardized signup dates and a governed region
      derived from the raw country code.
    columns:
      - name: customer_id
        description: Unique synthetic customer identifier.
        data_tests:
          - unique
          - not_null
      - name: region
        description: Governed reporting region derived from country_code.
        data_tests:
          - accepted_values:
              arguments:
                values: ['northern_europe', 'western_europe', 'southern_europe']
      - name: acquisition_channel
        description: Channel credited with acquiring the customer signup.
        data_tests:
          - accepted_values:
              arguments:
                values: ['organic_search', 'paid_search', 'paid_social', 'referral', 'affiliate', 'direct']

  - name: stg_subscriptions
    description: >-
      One row per subscription instance with clean lifecycle timestamps and
      simple paid-conversion and cancellation flags.
    columns:
      - name: subscription_id
        description: Unique subscription identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who owns the subscription.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: current_status
        description: Subscription status at the reporting cutoff.
        data_tests:
          - accepted_values:
              arguments:
                values: ['trialing', 'active', 'past_due', 'canceled']

  - name: stg_payment_attempts
    description: >-
      One row per invoice collection attempt with an exact euro amount and
      reusable retry and success flags.
    columns:
      - name: payment_attempt_id
        description: Unique payment-attempt identifier.
        data_tests:
          - unique
          - not_null
      - name: invoice_id
        description: Invoice against which collection was attempted.
        data_tests:
          - not_null
      - name: payment_status
        description: Outcome of this individual collection attempt.
        data_tests:
          - accepted_values:
              arguments:
                values: ['succeeded', 'failed']
      - name: currency_code
        description: Currency of the attempted amount.
        data_tests:
          - accepted_values:
              arguments:
                values: ['EUR']
  - name: stg_plans
    description: >-
      One row per subscription plan version with the original minor-unit price,
      an exact euro price, and a reusable current-version flag.
    columns:
      - name: plan_version_id
        description: Unique identifier for a specific version of a subscription plan.
        data_tests:
          - unique
          - not_null
      - name: plan_code
        description: Stable product-plan code shared by different versions of the same plan.
      - name: plan_tier
        description: Commercial tier of the subscription plan.
        data_tests:
          - accepted_values:
              arguments:
                values: ['standard', 'premium']
      - name: billing_interval
        description: Recurring billing frequency for the plan version.
        data_tests:
          - accepted_values:
              arguments:
                values: ['month', 'year']
      - name: price_minor_units
        description: Plan price stored as integer euro cents in the raw source.
      - name: price_eur
        description: Exact plan price in euros derived from price_minor_units.
      - name: currency_code
        description: Currency used for the plan price.
        data_tests:
          - accepted_values:
              arguments:
                values: ['EUR']
      - name: trial_days
        description: Number of trial days offered by the plan version.
      - name: valid_from
        description: First date on which the plan version is valid.
      - name: valid_to
        description: Final validity date; null when the plan version remains current.
      - name: is_current_plan_version
        description: True when valid_to is null.

  - name: stg_invoices
    description: >-
      One row per amount billed to a subscription, preserving invoice grain
      while adding an exact euro amount and a reusable paid-status flag.
    columns:
      - name: invoice_id
        description: Unique identifier for the invoice.
        data_tests:
          - unique
          - not_null
      - name: subscription_id
        description: Subscription being billed.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_subscriptions')
                field: subscription_id
      - name: plan_version_id
        description: Plan version whose commercial terms produced the invoice.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_plans')
                field: plan_version_id
      - name: billing_reason
        description: Business event that caused the invoice to be created.
        data_tests:
          - accepted_values:
              arguments:
                values: ['initial_subscription', 'subscription_cycle', 'plan_change']
      - name: billing_period_start
        description: First service date covered by the invoice.
      - name: billing_period_end
        description: Exclusive end date of the service period.
      - name: issued_at
        description: UTC timestamp when the invoice was finalized for collection.
      - name: due_at
        description: UTC timestamp when payment was due.
      - name: amount_due_minor_units
        description: Amount billed as integer euro cents in the raw source.
      - name: amount_due_eur
        description: Exact amount billed in euros derived from amount_due_minor_units.
      - name: currency_code
        description: Currency used for the invoice amount.
        data_tests:
          - accepted_values:
              arguments:
                values: ['EUR']
      - name: invoice_status
        description: Invoice status at the reporting cutoff.
        data_tests:
          - accepted_values:
              arguments:
                values: ['open', 'paid', 'uncollectible', 'void']
      - name: paid_at
        description: UTC timestamp when full collection completed; null otherwise.
      - name: is_paid
        description: True when invoice_status is paid.
