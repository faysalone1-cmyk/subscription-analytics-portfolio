version: 2

models:
  - name: dim_customers
    description: >-
      One row per SkillSpring customer containing governed acquisition,
      geography, device, learning-goal, and signup-cohort attributes.
    columns:
      - name: customer_id
        description: Unique customer identifier and dimension key.
        data_tests:
          - unique
          - not_null

      - name: signup_at
        description: UTC timestamp when the customer registered.

      - name: signup_date
        description: Calendar date on which the customer registered.
        data_tests:
          - not_null

      - name: signup_month
        description: First calendar day of the customer's signup month.
        data_tests:
          - not_null

      - name: country_code
        description: Country code recorded at signup.

      - name: region
        description: Governed reporting region derived from country_code.
        data_tests:
          - accepted_values:
              arguments:
                values: ['northern_europe', 'western_europe', 'southern_europe']

      - name: acquisition_channel
        description: Channel credited with acquiring the customer.
        data_tests:
          - accepted_values:
              arguments:
                values: ['organic_search', 'paid_search', 'paid_social', 'referral', 'affiliate', 'direct']

      - name: acquisition_campaign
        description: Acquisition campaign recorded for the customer when applicable.

      - name: device_type
        description: Device category recorded when the customer registered.

      - name: learning_goal
        description: Learning objective selected by the customer.

  - name: dim_plan_versions
    description: >-
      One row per commercial plan version, preserving the exact price,
      billing terms, and effective dates used by historical fact rows.
    columns:
      - name: plan_version_id
        description: Unique identifier for the historical plan version.
        data_tests:
          - unique
          - not_null

      - name: plan_code
        description: Stable product-plan code shared by versions of the same plan.
        data_tests:
          - not_null

      - name: plan_tier
        description: Commercial tier of the plan version.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['standard', 'premium']

      - name: billing_interval
        description: Recurring billing frequency of the plan version.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['month', 'year']

      - name: price_minor_units
        description: Plan price stored as integer euro cents.
        data_tests:
          - not_null

      - name: price_eur
        description: Exact plan price in euros inherited from staging.
        data_tests:
          - not_null

      - name: currency_code
        description: Currency used for the plan price.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['EUR']

      - name: trial_days
        description: Number of trial days offered by the plan version.
        data_tests:
          - not_null

      - name: valid_from
        description: First date on which the plan version is valid.
        data_tests:
          - not_null

      - name: valid_to
        description: Final validity date; null when the version remains current.

      - name: is_current_plan_version
        description: True when valid_to is null.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
  - name: fct_subscriptions
    description: >-
      One row per subscription instance, accumulating its latest lifecycle
      milestones, current status, customer, and initial/current plan versions.
    columns:
      - name: subscription_id
        description: Unique identifier and fact-table grain for a subscription instance.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: Customer who owns the subscription.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: initial_plan_version_id
        description: Plan version selected when the subscription began.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_plan_versions')
                field: plan_version_id

      - name: current_plan_version_id
        description: Latest plan version associated with the subscription.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_plan_versions')
                field: plan_version_id

      - name: created_at
        description: UTC timestamp when the subscription instance was created.
        data_tests:
          - not_null

      - name: created_date
        description: Calendar date on which the subscription was created.
        data_tests:
          - not_null

      - name: created_month
        description: First calendar day of the subscription creation month.
        data_tests:
          - not_null

      - name: trial_started_at
        description: UTC timestamp when the subscription trial began.
        data_tests:
          - not_null

      - name: trial_scheduled_end_at
        description: Scheduled UTC timestamp for the trial to end.
        data_tests:
          - not_null

      - name: paid_started_at
        description: UTC timestamp of first paid access; null when never converted.

      - name: current_period_start_at
        description: Start timestamp of the latest known paid billing period.

      - name: current_period_end_at
        description: Exclusive end timestamp of the latest known paid billing period.

      - name: current_status
        description: Latest subscription status at the reporting cutoff.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['trialing', 'active', 'past_due', 'canceled']

      - name: cancel_requested_at
        description: UTC timestamp when cancellation was requested, when applicable.

      - name: ended_at
        description: UTC timestamp when subscription access ended, when applicable.

      - name: converted_to_paid
        description: True when the subscription has a paid-start timestamp.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

      - name: is_canceled
        description: True when the latest subscription status is canceled.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

      - name: trial_to_paid_days
        description: Whole days between trial start and first paid access.

      - name: completed_lifetime_days
        description: Whole days from creation to ending; null for subscriptions not ended.

  - name: fct_subscription_events
    description: >-
      One immutable row per subscription lifecycle event, preserving the
      ordered status and plan-version transition for historical analysis.
    columns:
      - name: subscription_event_id
        description: Unique identifier and fact-table grain for a lifecycle event.
        data_tests:
          - unique
          - not_null

      - name: subscription_id
        description: Subscription to which the lifecycle event belongs.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_subscriptions')
                field: subscription_id

      - name: customer_id
        description: Customer who owns the event's subscription.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: event_sequence
        description: Contiguous event order within each subscription, beginning at one.
        data_tests:
          - not_null

      - name: event_at
        description: UTC timestamp when the lifecycle event occurred.
        data_tests:
          - not_null

      - name: event_date
        description: Calendar date on which the lifecycle event occurred.
        data_tests:
          - not_null

      - name: event_month
        description: First calendar day of the lifecycle event month.
        data_tests:
          - not_null

      - name: event_type
        description: Governed lifecycle-event classification.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['trial_started', 'trial_converted', 'plan_changed', 'past_due', 'payment_recovered', 'cancel_requested', 'cancellation_revoked', 'canceled']

      - name: from_status
        description: Status before the event; null only for the initial trial_started event.
        data_tests:
          - accepted_values:
              arguments:
                values: ['trialing', 'active', 'past_due', 'canceled']

      - name: to_status
        description: Status immediately after the event.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['trialing', 'active', 'past_due', 'canceled']

      - name: from_plan_version_id
        description: Plan version before the event; null only for trial_started.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_plan_versions')
                field: plan_version_id

      - name: to_plan_version_id
        description: Plan version immediately after the event.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_plan_versions')
                field: plan_version_id

      - name: event_reason
        description: Optional operational reason recorded for the lifecycle event.
